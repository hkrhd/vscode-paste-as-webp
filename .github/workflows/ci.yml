name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run check-types

      - name: Run lint
        run: npm run lint

      - name: Verify production bundle
        run: npm run package

  test-electron:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        vscode-version:
          - "1.118.0"
          - stable

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run extension tests
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode-version }}
        run: xvfb-run -a npm test
