name: Semantic Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            tools/release/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run check-types

      - name: Run lint
        run: npm run lint

      - name: Run extension tests
        env:
          VSCODE_TEST_VERSION: "1.118.0"
        run: xvfb-run -a npm test

      - name: Verify production bundle
        run: npm run package

      - name: Install release dependencies
        run: npm ci --prefix tools/release

      - name: Verify release without publishing
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: npm run release:dry-run -- --branches "$GITHUB_REF_NAME"

      - name: Semantic Release
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: npm run semantic-release
